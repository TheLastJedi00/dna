<app-user-panel-header></app-user-panel-header>
<main class="pt-header gradient-primary-to-secondary-85 min-h-[80vh]">
  <section class="main-padding container mx-auto bg-white">
    <div class="flex flex-col gap-3 sm:flex-row sm:justify-between sm:items-center">
      <h1 class="capitalize text-xl font-merriweather text-primary">Gerir de {{ type() }}</h1>
      <app-icon-text-button
        icon="arrow-left"
        text="Voltar"
        (click)="this.router.navigate(['dashboard'])"
      ></app-icon-text-button>
    </div>

    <!-- Controles: nova Maestra, busca e filtro de status (empilham no mobile) -->
    <div class="mt-4 grid gap-3 md:grid-cols-[1fr_1.5fr_auto] md:items-center">
      <app-new-user-form (saved)="load()"></app-new-user-form>

      <input
        type="search"
        placeholder="Buscar por nome"
        [ngModel]="search()"
        (ngModelChange)="onSearchChange($event)"
      />

      <div class="grid grid-cols-3 gap-1 rounded-xl bg-primary/10 p-1">
        <button
          type="button"
          class="rounded-lg py-1 text-sm"
          [class.bg-primary]="status() === 'active'"
          [class.text-white]="status() === 'active'"
          (click)="setStatus('active')"
        >
          Ativas
        </button>
        <button
          type="button"
          class="rounded-lg py-1 text-sm"
          [class.bg-primary]="status() === 'inactive'"
          [class.text-white]="status() === 'inactive'"
          (click)="setStatus('inactive')"
        >
          Inativas
        </button>
        <button
          type="button"
          class="rounded-lg py-1 text-sm"
          [class.bg-primary]="status() === 'all'"
          [class.text-white]="status() === 'all'"
          (click)="setStatus('all')"
        >
          Todas
        </button>
      </div>
    </div>

    <div class="mt-3 min-h-[55vh]">
      @if (isLoading()) {
        <app-infinity></app-infinity>
      } @else {
        <app-detailed-list [users]="users()" (changed)="load()"></app-detailed-list>
      }
    </div>

    <!-- Paginação -->
    @if (totalPages() > 1) {
      <div class="mt-4 flex flex-wrap items-center justify-center gap-3">
        <app-icon-text-button
          icon="arrow-left"
          text="Anterior"
          [disabled]="page() <= 1"
          (click)="goToPage(page() - 1)"
        ></app-icon-text-button>
        <span class="text-sm text-secondary">Página {{ page() }} de {{ totalPages() }}</span>
        <app-icon-text-button
          icon="chevron-right"
          text="Próxima"
          [disabled]="page() >= totalPages()"
          (click)="goToPage(page() + 1)"
        ></app-icon-text-button>
      </div>
    }
  </section>
</main>
<app-user-panel-footer></app-user-panel-footer>
