<section class="container main-padding mx-auto bg-white">
  @defer (on viewport) {
    <div animate.enter="slide-in" class="grid gap-3 mt-3">
      <app-dh-intro-card title="Centros" [intro]="intro()" [userId]="userId()"></app-dh-intro-card>
      <app-vertical-accordion
        title="Centros Definidos"
        titleClass="text-title"
        [cardContent]="introDefinidos()"
        contentClass="text-black/70"
      ></app-vertical-accordion>
      <app-vertical-accordion
        title="Centros Indefinidos"
        titleClass="text-title"
        [cardContent]="introIndefinidos()"
        contentClass="text-black/70"
      ></app-vertical-accordion>
      <app-vertical-accordion
        title="Centros Indefinidos"
        titleClass="text-title"
        [cardContent]="introIndefinidos()"
        contentClass="text-black/70"
      ></app-vertical-accordion>
      <p class="text-black/70">
        Compreender seus Centros é fundamental para entender como você opera energeticamente, onde
        você tem estabilidade, onde você pode se perder, e onde você tem sabedoria natural ao
        observar os outros.
      </p>

      <div class="flex flex-col justify-center">
        <div class="grid grid-cols-3 text-secondary font-merriweather text-lg">
          <button class="slide-button" (click)="this.selectedCentro.set('definidos')">Definidos</button>
          <button class="slide-button" (click)="this.selectedCentro.set('indefinidos')">Indefinidos</button>
          <button class="slide-button" (click)="this.selectedCentro.set('abertos')">Abertos</button>
        </div>
        <hr
          class="w-[33.34%] text-secondary transition-all transition-[400ms]"
          [ngClass]="horizontalRuleClass()"
        />
        <div class="slider" [ngClass]="selectedCentro()">
          <div class="slide" [ngClass]="isHided('definidos')">
            <app-lists-card-grid [topics]="topicos()"></app-lists-card-grid>
          </div>
          <div class="slide" [ngClass]="isHided('indefinidos')">
            <app-lists-card-grid [topics]="topicos()"></app-lists-card-grid>
          </div>
          <div class="slide" [ngClass]="isHided('abertos')">
            <app-lists-card-grid [topics]="topicos()"></app-lists-card-grid>
          </div>
        </div>
      </div>
    </div>
  } @placeholder {
    <div class="h-[800px]"></div>
  }
</section>
