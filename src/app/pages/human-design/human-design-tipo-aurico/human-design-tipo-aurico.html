<section class="container mx-auto main-padding bg-white">
  @defer (on viewport) {
    <div animate.enter="slide-in">
      <app-dh-intro-card
        title="Tipo Áurico, Estratégia, Assinatura e Não-Ser"
        [singleIntro]="intro()"
        [userId]="userId()"
      ></app-dh-intro-card>
      <div class="mt-4 flex flex-col gap-4">
        <app-vertical-accordion
          title="Tipo Áurico"
          contentClass="text-black/70"
          [cardContent]="introTipoAurico"
          titleClass="text-title"
        ></app-vertical-accordion>
        <app-vertical-accordion
          title="Estratégia"
          contentClass="text-black/70"
          [cardContent]="introEstrategia"
          titleClass="text-title"
        ></app-vertical-accordion>
        <app-vertical-accordion
          title="Assinatura"
          contentClass="text-black/70"
          [cardContent]="introAssinatura"
          titleClass="text-title"
        ></app-vertical-accordion>
        <app-vertical-accordion
          title="Tema do Não-Ser"
          contentClass="text-black/70"
          [cardContent]="introNaoSer"
          titleClass="text-title"
        ></app-vertical-accordion>
      </div>
      <app-lists-card-grid [topics]="topics()"></app-lists-card-grid>
    </div>
    <div class="w-full flex justify-center mt-2">
      <app-icon-text-button
        icon="arrow-left"
        text="Voltar"
        (click)="navigateTo('')"
      ></app-icon-text-button>
    </div>
  } @placeholder {
    <div class="h-[800px]"></div>
  }
</section>
