<section class="container mx-auto main-padding bg-white">
  @defer (on viewport) {
    <div animate.enter="slide-in">
      <div class="my-3 flex justify-between">
        <h3 [ngClass]="titleClass">Tipo Áurico, Estratégia, Assinatura e Não-Ser</h3>
        <app-icon-text-button
          icon="arrow-left"
          text="Voltar"
          (click)="navigateTo('')"
        ></app-icon-text-button>
      </div>
      <p class="text-black/70">{{ intro }}</p>
      <div class="mt-4 flex flex-col gap-4">
        <app-vertical-accordion
          title="Tipo Áurico"
          contentClass="text-black/70"
          [cardContent]="introTipoAurico"
          [titleClass]="`${titleClass}`"
        ></app-vertical-accordion>
        <app-vertical-accordion
          title="Estratégia"
          contentClass="text-black/70"
          [cardContent]="introEstrategia"
          [titleClass]="`${titleClass}`"
        ></app-vertical-accordion>
        <app-vertical-accordion
          title="Assinatura"
          contentClass="text-black/70"
          [cardContent]="introAssinatura"
          [titleClass]="`${titleClass}`"
        ></app-vertical-accordion>
        <app-vertical-accordion
          title="Tema do Não-Ser"
          contentClass="text-black/70"
          [cardContent]="introNaoSer"
          [titleClass]="`${titleClass}`"
        ></app-vertical-accordion>
      </div>
    </div>
  } @placeholder {
    <div class="h-[800px]"></div>
  }
</section>
