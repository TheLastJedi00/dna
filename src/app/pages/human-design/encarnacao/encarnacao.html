<section class="container mx-auto bg-white main-padding">
  @defer (on viewport) {
    <div animate.enter="slide-in">
      <app-dh-intro-card title="Cruz Da Encarnação" [userId]="userId()"></app-dh-intro-card>
      <div class="text-black/70 grid gap-3">
        @for (p of intro(); track $index) {
          <p>{{ p }}</p>
        }
        <app-vertical-accordion
          title="Grupos de Destino"
          titleClass="text-title"
          [cardContent]="grupos()"
          contentClass="grid gap-2"
        ></app-vertical-accordion>
      </div>
      <app-lists-card-grid [topics]="topics()"></app-lists-card-grid>
    </div>
  } @placeholder {
    <div class="h-[800px]"></div>
  }
</section>
