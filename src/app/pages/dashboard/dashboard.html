<app-user-panel-header></app-user-panel-header>
<main class="pt-header">
  <app-welcome-band greeting="Olá," [name]="displayName()" [nameIsEmail]="nameIsEmail()">
    <p class="band-text">{{ subtitle() }}</p>
    @if (roleBadge(); as role) {
      <span class="role">{{ role }}</span>
    }
    @if (loadFailed()) {
      <button type="button" class="retry" (click)="currentUser.reload()">
        Não foi possível carregar seu nome. Tentar novamente
      </button>
    }
  </app-welcome-band>
  <app-panel-card></app-panel-card>
</main>
<app-user-panel-footer></app-user-panel-footer>

@if (login.isSessionValid() && !login.emailVerified()) {
  <app-verify-email-modal />
}
