<app-user-panel-header></app-user-panel-header>
<main class="pt-header">
  <app-welcome-band
    greeting="Meu perfil"
    [name]="displayName()"
    [nameIsEmail]="nameIsEmail()"
    [compact]="true"
  >
    <a bandTop routerLink="/dashboard" class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="m15 5-7 7 7 7" />
      </svg>
      Início
    </a>
    <div class="mail-line">
      <span class="mail">{{ login.email }}</span>
      @if (login.emailVerified()) {
        <span class="badge badge-ok">E-mail confirmado</span>
      } @else {
        <span class="badge badge-warn">E-mail não confirmado</span>
      }
    </div>
  </app-welcome-band>

  <div class="profile-body">
    <div class="panel">
      <app-setting-section
        heading="Senha"
        description="A senha que você usa para entrar."
        actionLabel="Alterar senha"
        [(open)]="passwordOpen"
      >
        <app-change-password-form (cancel)="passwordOpen.set(false)" />
      </app-setting-section>
      <app-setting-section
        heading="E-mail"
        [description]="login.email"
        actionLabel="Alterar e-mail"
        [(open)]="emailOpen"
      >
        <app-change-email-form (cancel)="emailOpen.set(false)" />
      </app-setting-section>
    </div>

    <div class="panel panel-danger">
      <app-setting-section
        class="danger"
        heading="Excluir conta"
        description="Apaga sua conta e todos os seus dados. Não dá para desfazer."
        actionLabel="Excluir conta"
        tone="danger"
        [(open)]="deleteOpen"
      >
        <app-delete-account (cancel)="deleteOpen.set(false)" />
      </app-setting-section>
    </div>
  </div>
</main>
<app-user-panel-footer></app-user-panel-footer>
