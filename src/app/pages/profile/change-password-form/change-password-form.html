<form class="settings-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="settings-field">
    <label for="pw-current">Senha atual</label>
    <input id="pw-current" type="password" autocomplete="current-password" formControlName="current" />
  </div>
  <div class="settings-field">
    <label for="pw-next">Nova senha</label>
    <input
      id="pw-next"
      type="password"
      autocomplete="new-password"
      formControlName="next"
      aria-describedby="pw-next-hint"
    />
    <span id="pw-next-hint" class="settings-hint">Pelo menos {{ minLength }} caracteres.</span>
  </div>
  <div class="settings-field">
    <label for="pw-confirm">Repita a nova senha</label>
    <input id="pw-confirm" type="password" autocomplete="new-password" formControlName="confirm" />
    @if (form.hasError('mismatch') && form.controls.confirm.touched) {
      <span class="settings-hint text-danger">As senhas não são iguais.</span>
    }
  </div>

  @if (done()) {
    <p class="settings-msg" role="status">Senha alterada. Use a nova senha no próximo login.</p>
  }
  @if (error()) {
    <p class="settings-msg settings-msg-error" role="alert">{{ error() }}</p>
  }

  <div class="settings-actions">
    <button type="submit" class="settings-submit" [disabled]="saving()">
      {{ saving() ? 'Salvando…' : 'Salvar nova senha' }}
    </button>
    <button type="button" class="settings-cancel" (click)="cancel.emit()">
      {{ done() ? 'Fechar' : 'Cancelar' }}
    </button>
  </div>
</form>
