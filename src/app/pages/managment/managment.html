<app-user-panel-header [userId]="userId()"></app-user-panel-header>
<main class="pt-header gradient-primary-to-secondary-85 min-h-[80vh]">
  <section class="main-padding container mx-auto bg-white">
    <div class="flex justify-between items-center">
      <h1 class="capitalize text-xl font-merriweather text-primary">Gerir de {{ type() }}</h1>
      <app-icon-text-button
        icon="arrow-left"
        text="Voltar"
        (click)="this.router.navigate([`dashboard/${userId()}`])"
      ></app-icon-text-button>
    </div>
    <div class="mt-3 min-h-[65vh]">
      <app-detailed-list [managerId]="userId()" [type]="type()"></app-detailed-list>
    </div>
  </section>
</main>
<app-user-panel-footer></app-user-panel-footer>
