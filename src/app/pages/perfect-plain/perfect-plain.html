<app-user-panel-header></app-user-panel-header>
<main class="pt-header min-h-[80vh] main-padding">
  <app-dna-title-card
    title="Plano Perfeito"
    subTitle="Sua rota de mentoria"
    imgSrc="https://i.imgur.com/ji8gc9V.png"
  >
  </app-dna-title-card>
  <app-dna-description-card
    title="O que é o Plano Perfeito?"
    [innerHtml]="perfectPlainIntro()"
  >
  </app-dna-description-card>
  <app-intro-card
    title="Plano Perfeito"
    singleIntro="A síntese dos seus três pilares — Desenho Humano, Numerologia e Astrologia — reunida num plano único e prático."
    [backLink]="backLink()"
  ></app-intro-card>

  @if (topics()) {
    <app-lists-card-grid [topics]="topics()"></app-lists-card-grid>
  } @else if (error()) {
    <p class="text-black/70 py-6">{{ error() }}</p>
  }
</main>
<app-user-panel-footer></app-user-panel-footer>

@if (isLoading()) {
  <app-infinity></app-infinity>
}
