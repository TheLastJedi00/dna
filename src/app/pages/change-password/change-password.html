<!--
  Modal estático: sem backdrop clicável e sem "Voltar" — não há como fechá-lo sem
  definir a senha. Só o logout tira o usuário daqui.
-->
<main
  class="min-h-screen flex flex-col items-center justify-center gap-4 gradient-primary-to-secondary-85 py-8"
>
  <app-change-password-form
    [isLoading]="isLoading()"
    [error]="error()"
    (save)="onSave($event)"
  ></app-change-password-form>

  <app-button
    variant="text"
    text="Sair"
    classes="text-white"
    (action)="logout()"
  ></app-button>
</main>

@if (isLoading()) {
  <app-infinity></app-infinity>
}
