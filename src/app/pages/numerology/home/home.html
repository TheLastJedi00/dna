<div class="mx-auto container bg-white main-padding">
  @defer (on viewport) {
    <div animate.enter="fade-in">
      <div class="grid lg:grid-cols-2 gap-3 mb-3">
        <app-user-data-card></app-user-data-card>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <app-num-data-button
            title="Motivação"
            [data]="numData()!.perfil.motivacao"
          ></app-num-data-button>

          <app-num-data-button
            title="Impressão"
            [data]="numData()!.perfil.impressao"
          ></app-num-data-button>

          <app-num-data-button
            title="Expressão"
            [data]="numData()!.perfil.expressao"
          ></app-num-data-button>

          <app-num-data-button
            title="Destino"
            [data]="numData()!.perfil.destino"
          ></app-num-data-button>

          <app-num-data-button
            title="Missão"
            [data]="numData()!.perfil.missao"
          ></app-num-data-button>

          <app-num-data-button
            title="Data Natalícia"
            [data]="numData()!.perfil.data_natalicia"
          ></app-num-data-button>

          <app-num-data-button
            title="Número Psíquico"
            [data]="numData()!.perfil.numero_psiquico"
          ></app-num-data-button>

          <app-num-data-button
            title="Talento Oculto"
            [data]="numData()!.perfil.talento_oculto"
          ></app-num-data-button>
        </div>
        <app-num-data-button
          title="Ciclos de Vida"
          [periods]="numData()!.ciclos_de_vida"
          periodTitle="Ciclo"
        ></app-num-data-button>
        <app-num-data-button
          title="Desafios de Vida"
          periodTitle="Desafio"
          [periods]="numData()!.desafios"
        ></app-num-data-button>
      </div>
      <div class="grid sm:grid-cols-[4fr_2fr] gap-3">
        <app-num-data-button
          [cols]="4"
          title="Momentos decisivos"
          periodTitle="Momento"
          [periods]="numData()!.momentos_decisivos"
        ></app-num-data-button>
        <app-num-data-button
          [isAnoPessoal]="true"
          [anoPessoalData]="numData()!.ano_pessoal"
        ></app-num-data-button>
      </div>
    </div>
  } @placeholder {
    <div class="h-[800px]"></div>
  }
</div>
