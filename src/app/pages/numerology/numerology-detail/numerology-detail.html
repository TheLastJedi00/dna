@if (isLoading()) {
  <app-infinity></app-infinity>
} @else {
  <section class="container mx-auto bg-white main-padding">
    @defer (on viewport) {
      <div animate.enter="slide-in">
        <app-intro-card
          [title]="moduleTitle()"
        ></app-intro-card>
        @if (error()) {
          <div class="text-center text-muted py-10">
            <p>{{ error() }}</p>
          </div>
        }
        @if (topics()) {
          <app-lists-card-grid [topics]="topics()"></app-lists-card-grid>
        }
      </div>
    } @placeholder {
      <div class="h-[800px]"></div>
    }
  </section>
}
