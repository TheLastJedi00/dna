<div
  class="fixed z-10 top-0 left-0 flex items-center justify-center flex-col gap-5 w-full h-full bg-white/50 backdrop-blur-[2px]"
  animate.enter="loading-enter"
  animate.leave="loading-leave"
>
  <div class="w-[300px]" [ngStyle]="{ scale: scale() }">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
      <path
        fill="none"
        stroke="#4E2E13"
        stroke-width="15"
        stroke-linecap="round"
        stroke-dasharray="300 385"
        stroke-dashoffset="0"
        d="M275 75c0 31-27 50-50 50-58 0-92-100-150-100-28 0-50 22-50 50s23 50 50 50c58 0 92-100 150-100 24 0 50 19 50 50Z"
      >
        <animate
          attributeName="stroke-dashoffset"
          calcMode="spline"
          dur="2"
          values="685;-685"
          keySplines="0 0 1 1"
          repeatCount="indefinite"
        ></animate>
      </path>
    </svg>
  </div>
  @if (message()) {
    <div class="px-[10vw]">
      <h1 class="text-primary font-semibold text-2xl">{{ message() }}</h1>
    </div>
  }
</div>
