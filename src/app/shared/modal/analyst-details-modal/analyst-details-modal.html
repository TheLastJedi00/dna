@if (isOpen()) {
  <section
    animate.enter="expand"
    animate.leave="collapse"
    (click)="close.emit()"
    class="fixed z-10 h-screen w-screen top-0 left-0 flex items-center justify-center backdrop-blur-[2px] bg-white/20"
  >
    <div
      class="p-3 bg-white shadow-xl rounded-xl transition-all w-full max-w-[400px] mx-3 max-h-[90vh] overflow-y-auto"
      (click)="$event.stopPropagation()"
    >
      <h1 class="text-primary font-merriweather break-words">{{ analyst().fullName }}</h1>
      <div class="text-black/70 py-3">
        @if (analyst().email) {
          <p class="break-all">{{ analyst().email }}</p>
        }
        <p class="text-sm">
          {{ analyst().isActive === false ? 'Analista inativo' : 'Analista ativo' }}
        </p>
      </div>

      <div class="grid py-3 gap-3">
        @if (analyst().isActive === false) {
          <app-icon-text-button
            (click)="reactivate.emit()"
            icon="lock-open"
            text="Reativar"
            class="bg-secondary rounded-xl text-white w-full text-center"
          ></app-icon-text-button>
        } @else {
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <app-icon-text-button
              (click)="edit.emit()"
              icon="pencil"
              text="Editar"
              class="bg-secondary rounded-xl text-white"
            ></app-icon-text-button>
            <app-icon-text-button
              (click)="disable.emit()"
              icon="lock-closed"
              text="Desativar"
              class="bg-[red] rounded-xl text-white"
            ></app-icon-text-button>
          </div>
        }
        <app-icon-text-button
          icon="arrow-left"
          text="Voltar"
          class="bg-primary rounded-xl text-white w-full text-center"
          (click)="close.emit()"
        ></app-icon-text-button>
      </div>
    </div>
  </section>
}
