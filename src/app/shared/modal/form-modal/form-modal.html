@if (isOpen()) {
  <section
    animate.enter="expand"
    animate.leave="collapse"
    (click)="onClose()"
    class="fixed z-10 h-screen w-screen top-0 left-0 flex items-start justify-center backdrop-blur-[2px] bg-white/20 overflow-auto py-10"
  >
    <div
      class="p-4 bg-white shadow-xl rounded-xl transition-all max-w-[500px] w-full mx-3"
      (click)="$event.stopPropagation()"
    >
      <div class="flex justify-between items-center mb-3">
        @if (title()) {
          <h2 class="text-secondary font-merriweather text-xl">{{ title() }}</h2>
        }
        <button
          type="button"
          (click)="onClose()"
          class="text-black/50 text-2xl leading-none px-2"
          aria-label="Fechar"
        >
          &times;
        </button>
      </div>
      <ng-content></ng-content>
    </div>
  </section>
}
