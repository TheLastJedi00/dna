<button class="button" (click)="onClick()">
    <div class="text-left">
      <div>
        <img class="img" src="{{ imgSrc() }}" alt="{{ title() }}" />
        <h3 class="text-primary font-semibold mt-4 font-merriweather">{{ title() }}</h3>
        <h4 class="text-secondary text-sm">{{ subtitle() }}</h4>
        <p class="opacity-80 text-sm">{{ description() }}</p>
      </div>
      <div class="mt-4">
        <p class="text-hover text-sm text-primary font-semibold">ACESSAR DETALHES</p>
      </div>
    </div>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-10 text-secondary"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
    </svg>
</button>
