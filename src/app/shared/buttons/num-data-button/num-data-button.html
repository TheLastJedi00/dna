<button class="grid gap-1 rounded-xl p-3 sm:p-2 data-button w-full h-full">
  @if (data() || dataArray()) {
    <div class="aspect-square flex flex-col justify-between">
      <h4 class="text-secondary font-merriweather text-normal sm:text-sm">{{ title() }}</h4>
      @if (data()) {
        <p class="text-primary text-xl">{{ data() }}</p>
      } @else {
        @for (d of dataArray(); track $index) {
          <p class="text-primary text-xl">{{ dataArray() }}</p>
        }
      }
      <div class="flex justify-center">
        <span class="text-primary opacity-50">Detalhes</span>
        <app-arrow-left customClass="text-secondary scale-50 rotate-180"></app-arrow-left>
      </div>
    </div>
  }
  @if (periods() !== null) {
    <h4 class="text-secondary font-merriweather text-normal">{{ title() }}</h4>
    <div class="grid gap-5" [ngClass]="`md:grid-cols-${cols()}`">
      @for (period of periods(); track $index) {
        <div class="text-primary text-left grid grid-cols-2 md:grid-cols-1">
          <div>
            <h4 class="font-semibold text-normal">{{ periodTitle() }} {{ $index + 1 }}</h4>
            <p><b>Início: </b>{{ period.inicio }}</p>
            <p><b>Fim: </b>{{ period.fim }}</p>
          </div>
          <p class="text-xl text-center my-5">{{ period.numero }}</p>
        </div>
      }
    </div>
    <div class="flex justify-center">
      <span class="text-primary opacity-50">Detalhes</span>
      <app-arrow-left customClass="text-secondary scale-50 rotate-180"></app-arrow-left>
    </div>
  }
  @if (isAnoPessoal()) {
    <h4 class="text-secondary font-merriweather text-normal">Ano Pessoal</h4>
    <div class="grid grid-cols-2">
      <div class="text-primary text-left grid">
        <h4 class="font-semibold text-normal">Atual</h4>
        <p>{{ anoPessoalData()!.atual.validade }}</p>
        <p [ngClass]="anoPessoalNumberClass">{{ anoPessoalData()!.atual.numero }}</p>
      </div>
      <div class="text-primary text-left grid">
        <h4 class="font-semibold text-normal">Próximo</h4>
        <p>{{ anoPessoalData()!.proximo.validade }}</p>
        <p [ngClass]="anoPessoalNumberClass">{{ anoPessoalData()!.proximo.numero }}</p>
      </div>
    </div>
    <div class="flex justify-center">
      <span class="text-primary opacity-50">Detalhes</span>
      <app-arrow-left customClass="text-secondary scale-50 rotate-180"></app-arrow-left>
    </div>
  }
</button>
