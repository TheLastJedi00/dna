<div class="panel-body">
  @if (isClient()) {
    <section aria-labelledby="pillars-title">
      <h2 id="pillars-title" class="section-title">Seus pilares</h2>
      <p class="section-lead">Cada pilar mostra uma parte de como você funciona e decide.</p>
      <div class="map map-pillars">
        <app-map-row
          title="Desenho Humano"
          kicker="Sua estratégia natural"
          description="Como sua energia opera e como tomar decisões alinhadas com sua essência."
          [imgSrc]="images.humanDesign"
          (action)="goToPillar('human-design')"
        />
        <app-map-row
          title="Numerologia"
          kicker="A vibração do seu destino"
          description="Os ciclos numéricos que regem sua vida e o propósito por trás do seu nome."
          [imgSrc]="images.numerology"
          (action)="goToPillar('numerology')"
        />
        <app-map-row
          title="Astrologia"
          kicker="O mapa do seu sucesso"
          description="A influência dos astros na sua jornada empreendedora e nos seus talentos."
          [imgSrc]="images.astrology"
          (action)="goToPillar('astrology')"
        />
      </div>

      <!-- O Plano Perfeito vem depois dos três: é a união deles -->
      <button type="button" class="plan" (click)="goToPillar('perfect-plain')">
        <span class="joins" aria-hidden="true">
          <img [src]="images.humanDesign" alt="" />
          <img [src]="images.numerology" alt="" />
          <img [src]="images.astrology" alt="" />
        </span>
        <span class="plan-text">
          <span class="plan-title">Plano Perfeito</span>
          <span class="plan-description">
            A união dos três pilares em um guia prático para escalar o seu negócio.
          </span>
          <span class="plan-go">Abrir meu plano</span>
        </span>
      </button>
    </section>
  }

  @if (canManageMaestras()) {
    <section class="grid grid-cols-1 gap-3 md:grid-cols-3" [class.after-section]="isClient()">
      <app-dashboard-button
        (action)="go('management/maestras')"
        icon="users"
        title="Gerenciar Maestras"
        subtitle=""
        description=""
      ></app-dashboard-button>
      <app-dashboard-button
        (action)="go('dna-management')"
        icon="book"
        title="Gerenciar Análises do DNA"
        subtitle=""
        description=""
      ></app-dashboard-button>
      @if (canManageAnalysts()) {
        <app-dashboard-button
          (action)="go('analysts')"
          icon="user-circle"
          title="Gerenciar Analistas do DNA"
          subtitle=""
          description=""
        ></app-dashboard-button>
      }
    </section>
  }

  <section class="after-section" aria-labelledby="account-title">
    <h2 id="account-title" class="section-title">Sua conta</h2>
    <div class="map">
      <app-map-row
        title="Meu perfil"
        description="Senha, e-mail e exclusão da conta"
        icon="user-circle"
        [compact]="true"
        (action)="go('profile')"
      />
    </div>
  </section>
</div>
