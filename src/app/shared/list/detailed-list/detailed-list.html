<section class="grid gap-3">
  <div class="grid gap-3 sm:grid-cols-2 md:grid-cols-3">
    @for (user of users(); track user.id) {
      <app-detailed-item [data]="user" (select)="select.emit($event)"></app-detailed-item>
    }
  </div>
</section>

@if (users()?.length === 0) {
  <section class="h-[55vh] flex items-center justify-center">
    <h3 class="font-merriweather text-xl text-secondary text-center">
      Nenhuma maestra encontrada.
    </h3>
  </section>
}
