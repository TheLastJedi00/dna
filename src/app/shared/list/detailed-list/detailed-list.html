<section class="grid gap-3">
  <div>
    <app-new-user-form (modalClosed)="getAllActiveUsersFirstPage()"></app-new-user-form>
  </div>
  <div class="grid md:grid-cols-3 gap-3">
    @for (user of userList(); track $index) {
      <app-detailed-item [userId]="managerId()" [data]="user"></app-detailed-item>
    }
  </div>
</section>

@if (isLoading()) {
  <app-infinity></app-infinity>
}
@if (userList()?.length === 0) {
  <section class="h-[75vh] flex items-center justify-center">
    <h3 class="font-merriweather text-xl text-secondary">Nenhuma maestra ativa no momento.</h3>
  </section>
}
