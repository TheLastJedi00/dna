<div class="shadow-lg p-3 rounded-xl flex flex-col gap-2">
  <div class="flex items-center justify-between gap-2">
    <h3 class="text-lg text-secondary font-semibold">{{ data().fullName }}</h3>
    @if (data().isActive === false) {
      <span class="text-xs rounded-full bg-danger-soft text-danger px-2 py-0.5">Inativa</span>
    } @else {
      <span class="text-xs rounded-full bg-primary/10 text-primary px-2 py-0.5">Ativa</span>
    }
  </div>
  <app-icon-text-button
    icon="magnifying-glass"
    text="Detalhes"
    class="bg-primary text-white rounded-xl w-full"
    (click)="select.emit(data())"
    align="center"
  ></app-icon-text-button>
</div>
