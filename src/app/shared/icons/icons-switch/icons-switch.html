@switch (icon()) {
    @case ("heart") {
        <app-heart></app-heart>
    }
    @case ("shield") {
        <app-shield></app-shield>
    }
    @case ("bolt") {
        <app-bolt></app-bolt>
    }
    @case ("chat-bubble") {
        <app-chat-bubble></app-chat-bubble>
    }
    @case ("chart-pie") {
        <app-chart-pie></app-chart-pie>
    }
    @case ("pencil") {
        <app-pencil></app-pencil>
    }
    @case ("users") {
        <app-users></app-users>
    }
    @case ("flag") {
        <app-flag></app-flag>
    }
    @case ("user-circle") {
        <app-user-circle></app-user-circle>
    }
}
