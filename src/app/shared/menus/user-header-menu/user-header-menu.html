<button (click)="toggleMenu()" class="flex flex-col items-center justify-center p-2 cursor-pointer">
  <hr class="bg-primary" [ngClass]="toggle ? 'top-hr-closed' : ''" />
  <hr class="bg-primary" [ngClass]="toggle ? 'mid-hr-closed ' : ''" />
  <hr class="bg-primary" [ngClass]="toggle ? 'bottom-hr-closed' : ''" />
</button>
@if (toggle) {
  <aside
    class="flex items-start justify-end fixed inset-0 h-screen w-screen mt-header z-50 backdrop-blur-[2px] bg-black/20"
    animate.enter="backdrop-blur-aside"
    animate.leave="backdrop-blur-aside-out"
    (click)="toggle = false"
  >
    <div
      class="flex flex-col justify-between rounded-b-[30px] aside-menu-minimize p-5 bg-white h-[75vh] w-[70%] scale-100 opacity-100 origin-top-right md:w-[30vw] md:mr-[8vw]"
      animate.enter="aside-menu-expand"
      (click)="$event.stopPropagation()"
    >
      <div class="">
        <div class="text-center shadow-lg rounded-xl p-2 mb-5 gradient-primary-to-secondary-85">
          <span class="text-center font-merriweather text-sm w-full text-black/70"
            >DNA Empresária de:</span
          >
          <h1 class="text-primary font-style-script text-6xl text-center mt-4 italic">Bárbara</h1>
          <h2 class="font-style-script italic text-3xl text-secondary">Farias</h2>
        </div>
        @if (loginService.getUserRole()?.includes('USER')) {
          <div class="flex flex-col text-left">
            <app-button variant="text" classes="text-secondary" text="Home" (action)="router.navigate(['dashboard'])"></app-button>
            <app-button variant="text" classes="text-secondary" text="Desenho Humano" (action)="router.navigate(['human-design/' + loginService.userId])"></app-button>
            <app-button variant="text" classes="text-secondary" text="Numerologia" (action)="router.navigate(['numerology/' + loginService.userId])"></app-button>
            <app-button variant="text" classes="text-secondary" text="Astrologia" (action)="router.navigate(['astrology/' + loginService.userId])"></app-button>
            <app-button variant="text" classes="text-secondary" text="Plano Perfeito" (action)="router.navigate(['perfect-plain/' + loginService.userId])"></app-button>
          </div>
        }
        @if (loginService.getUserRole()?.includes('ADMIN')) {
          <div class="flex flex-col text-left">
            <app-button variant="text"
              classes="text-secondary"
              text="Home"
              (action)="router.navigate(['dashboard'])"
            ></app-button>
            <app-button variant="text"
              classes="text-secondary"
              text="Gerenciar Maestras"
              (action)="router.navigate(['management/maestras'])"
            ></app-button>
            <app-button variant="text"
              classes="text-secondary"
              text="Gerenciar Análises do DNA"
              (action)="router.navigate(['dna-management'])"
            ></app-button>
            @if (loginService.getUserRole()?.includes('MANAGER')) {
              <app-button variant="text"
                classes="text-secondary"
                text="Gerenciar Analistas do DNA"
              ></app-button>
            }
          </div>
        }
      </div>
      <div>
        <app-logout-button click></app-logout-button>
      </div>
    </div>
  </aside>
}
