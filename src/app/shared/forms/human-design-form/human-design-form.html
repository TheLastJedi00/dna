<form action="" class="grid gap-3 max-w-[400px] input:input">
  <input type="text" placeholder="Tipo Áurico" />
  <input type="text" placeholder="Aura" />
  <input type="text" placeholder="Energia" />
  <input type="text" placeholder="Palavra Chave" />
  <input type="text" placeholder="Estratégia" />
  <input type="text" placeholder="Assinatura" />
  <input type="text" placeholder="Tema do Não-Ser" />
  <input type="text" placeholder="Autoridade" />
  <input type="text" placeholder="Perfil" />
  <p for="">Centros Energéticos</p>
  <div class="grid pl-5 gap-3">
    <p for="">Definidos</p>
    <input type="text" placeholder="Centro Definido" />
    <app-icon-text-button
      icon="plus"
      text="Adicionar Centro"
      class="text-secondary shadow-sm rounded-xl w-full"
    ></app-icon-text-button>
  </div>
  <div class="grid pl-5 gap-3">
    <p for="">Indefinidos</p>
    <input type="text" placeholder="Centro Indefinido" />
    <app-icon-text-button
      icon="plus"
      text="Adicionar Centro"
      class="text-secondary shadow-sm rounded-xl w-full"
    ></app-icon-text-button>
  </div>
  <div class="grid pl-5 gap-3">
    <p for="">Abertos</p>
    <input type="text" placeholder="Centro Aberto" />
    <app-icon-text-button
      icon="plus"
      text="Adicionar Centro"
      class="text-secondary shadow-sm rounded-xl w-full"
    ></app-icon-text-button>
  </div>
  <div class="grid gap-3">
    <p>Canais</p>
    <div class="flex gap-3">
      <input type="text" placeholder="10-10" class="w-[5rem]" />
      <input type="text" placeholder="Canal" class="w-full" />
    </div>
    <app-icon-text-button
      icon="plus"
      text="Novo Canal"
      class="text-secondary shadow-sm rounded-xl w-full"
    ></app-icon-text-button>
  </div>
  <div class="grid gap-3">
    <p for="">Ativações</p>
    <div class="pl-5 grid gap-3">
      <p>Personalidade</p>
      <div class="grid grid-cols-3 gap-3">
        <input type="text" placeholder="Sol" />
        <input type="text" placeholder="Terra" />
        <input type="text" placeholder="Lua" />
      </div>
    </div>
    <div class="pl-5 grid gap-3">
      <p>Desenho</p>
      <div class="grid grid-cols-3 gap-3">
        <input type="text" placeholder="Sol" />
        <input type="text" placeholder="Terra" />
        <input type="text" placeholder="Lua" />
      </div>
    </div>
    <p>Encarnação</p>
    <div class="grid grid-cols-2 gap-3">
      <input type="text" placeholder="Ângulo" />
      <input type="text" placeholder="Cruz" />

      <input type="text" placeholder="Portões" />
      <input type="text" placeholder="Quarto de Cruz" />
    </div>
  </div>
  <app-icon-text-button icon="plus" text="Salvar Dados" class="bg-primary text-white rounded-xl w-full"></app-icon-text-button>
</form>
