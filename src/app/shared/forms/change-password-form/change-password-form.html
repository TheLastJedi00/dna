<form
  class="grid gap-3 p-4 rounded-xl shadow-xl bg-white w-full max-w-[400px] mx-3"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <h1 class="font-merriweather text-center text-secondary text-xl">Defina sua senha</h1>
  <p class="text-sm text-black/60 text-center">
    Você entrou com uma senha temporária. Para continuar, escolha uma senha só sua.
  </p>

  <input
    type="password"
    placeholder="Nova senha"
    formControlName="password"
  />
  <input
    type="password"
    placeholder="Confirmar nova senha"
    formControlName="confirmation"
  />

  @if (isMismatch) {
    <span class="text-sm text-center text-[red]">As senhas não coincidem.</span>
  }
  @if (error()) {
    <span class="text-sm text-center text-[red]">{{ error() }}</span>
  }

  <app-button
    variant="flat"
    text="Salvar senha"
    classes="bg-primary w-full text-white"
    [disabled]="form.invalid || isLoading()"
  ></app-button>
</form>
