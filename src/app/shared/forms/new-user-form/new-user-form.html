@if (showTrigger()) {
  <app-icon-text-button
    (click)="open.set(true)"
    icon="plus"
    [text]="newMaestraTerm()"
    class="w-full text-white bg-secondary text-center"
  ></app-icon-text-button>
}
@if (open()) {
  <div
    (click)="onCancel()"
    animate.enter="expand"
    animate.leave="collapse"
    class="fixed h-screen w-screen flex top-0 left-0 z-10 items-center justify-center bg-white/20 backdrop-blur-[2px]"
  >
    <form
      class="grid p-3 rounded-xl shadow-xl gap-3 bg-white w-full max-w-[400px] h-min mx-3"
      (click)="$event.stopPropagation()"
      [formGroup]="createUserForm"
      (ngSubmit)="submit()"
    >
      <h3 class="font-merriweather text-center text-secondary text-xl">
        {{ isEditing() ? 'Editar' : 'Adicionar' }} {{ maestraTerm() }}
      </h3>
      <input type="text" placeholder="Nome Completo" formControlName="fullName" />

      <!-- Pronome de tratamento: flexiona a interface e orienta o material gerado -->
      <div class="grid gap-1">
        <div class="pronoun-toggle" role="group" aria-label="Pronome de tratamento">
          <button
            type="button"
            class="pronoun-option"
            [class.is-selected]="pronoun() === 'feminino'"
            [class.bg-primary]="pronoun() === 'feminino'"
            [class.text-white]="pronoun() === 'feminino'"
            [attr.aria-pressed]="pronoun() === 'feminino'"
            (click)="setPronoun('feminino')"
          >
            Feminino
          </button>
          <button
            type="button"
            class="pronoun-option"
            [class.is-selected]="pronoun() === 'masculino'"
            [class.bg-primary]="pronoun() === 'masculino'"
            [class.text-white]="pronoun() === 'masculino'"
            [attr.aria-pressed]="pronoun() === 'masculino'"
            (click)="setPronoun('masculino')"
          >
            Masculino
          </button>
        </div>
        <span class="info-hint">
          ℹ️ Usado para personalizar o material gerado com maior precisão
        </span>
      </div>

      <input
        type="text"
        placeholder="Área de atuação da empresa"
        formControlName="businessArea"
      />
      <!--
        `date` e `time` ignoram o placeholder: sem rótulo visível o campo aparece
        como "dd/mm/aaaa" solto, sem dizer do que se trata.
      -->
      <div class="grid gap-1">
        <label class="text-sm text-muted" for="birth-date">Data de Nascimento</label>
        <input id="birth-date" type="date" formControlName="birthDate" />
      </div>
      <div class="grid gap-1">
        <label class="text-sm text-muted" for="birth-time">Hora do Nascimento</label>
        <input id="birth-time" type="time" formControlName="birthTime" />
      </div>
      <div class="grid gap-3">
        <hr class="opacity-20" />
        <label>Local de Nascimento</label>
        <div class="grid grid-cols-[3fr_1fr] gap-3">
          <input type="text" placeholder="Cidade" formControlName="birthCity" />
          <input type="text" placeholder="UF" class="w-[100%]" formControlName="birthUf" />
        </div>
      </div>
      @if (!isEditing()) {
        <div class="grid gap-3">
          <hr class="opacity-20" />
          <label>Acessos</label>
          <input type="text" placeholder="email@email.com" formControlName="email" />
          <div class="grid w-full">
            <button
              class="text-left font-sm mb-2 show-pass text-primary"
              type="button"
              (click)="togglePassVisibility()"
            >
              Exibir Senha
            </button>
            <input [type]="passwordInputType()" placeholder="Senha" formControlName="password" />
          </div>
        </div>
      }
      <div class="grid grid-cols-1 gap-3 mt-1 sm:grid-cols-2">
        <app-icon-text-button
          [disabled]="createUserForm.invalid"
          type="submit"
          icon="plus"
          text="Salvar"
          class="w-full text-white bg-primary rounded-xl"
        ></app-icon-text-button>
        <app-icon-text-button
          (click)="onCancel()"
          icon="arrow-left"
          text="Voltar"
          class="w-full text-primary bg-white rounded-xl"
        ></app-icon-text-button>
      </div>
    </form>
  </div>
}
@if (isLoading()) {
  <app-infinity></app-infinity>
}
