<form class="flex flex-col p-4 gap-4 shadow-xl rounded-xl bg-white/95" (ngSubmit)="onLogin()">
  <app-logo></app-logo>
  <input
    [ngModel]="email()"
    (ngModelChange)="email.set($event)"
    name="email"
    [disabled]="loading()"
    type="email"
    placeholder="Email"
    class="input-primary-light"
  />
  <input
    [ngModel]="password()"
    (ngModelChange)="password.set($event)"
    name="password"
    [disabled]="loading()"
    type="password"
    placeholder="Senha"
    class="input-primary-light"
  />
  @if (error()) {
    <span class="text-red-500 text-sm text-center">{{ error() }}</span>
  }
  <app-flat-button
    [text]="loading() ? 'Entrando...' : 'Entrar'"
    classes="bg-primary w-full text-white"
    [disabled]="loading()"
    (action)="onLogin()"
  ></app-flat-button>
</form>
