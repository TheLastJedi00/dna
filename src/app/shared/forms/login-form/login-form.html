<form
  class="flex flex-col p-4 gap-4 shadow-xl rounded-xl bg-white/95 md:min-h-[420px] md:min-w-[350px]"
  (ngSubmit)="onLogin()"
>
  <app-logo></app-logo>
  <input
    [ngModel]="email()"
    (ngModelChange)="email.set($event)"
    required
    name="email"
    type="email"
    placeholder="Email"
    class="input-primary-light"
  />
  <input
    [ngModel]="password()"
    (ngModelChange)="password.set($event)"
    required
    name="password"
    type="password"
    placeholder="Senha"
    class="input-primary-light"
  />
  @if(error()){
    <span class="text-center text-[red]">{{error()}}</span>
  }
  <app-flat-button
    text="Entrar"
    classes="bg-primary w-full text-white"
    (action)="onLogin()"
    [disabled]="isValid()"
  ></app-flat-button>
</form>

@if (isLoading()) {
  <app-infinity scale="2"></app-infinity>
}
